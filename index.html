<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaz Times</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000; --card: #111; --border: #222;
    --text: #fff; --muted: #888; --accent: #fff;
    --tag-bg: #222; --tag-text: #aaa;
    --active-bg: #fff; --active-text: #000;
    --toggle-bg: #222; --toggle-dot: #fff;
    --green-bg: rgba(34,197,94,.16); --green-border: rgba(34,197,94,.4); --green-text: #4ade80;
    --red-bg: rgba(239,68,68,.16); --red-border: rgba(239,68,68,.4); --red-text: #f87171;
  }
  [data-theme="light"] {
    --bg: #f5f5f5; --card: #fff; --border: #e0e0e0;
    --text: #000; --muted: #666; --accent: #000;
    --tag-bg: #eee; --tag-text: #666;
    --active-bg: #000; --active-text: #fff;
    --toggle-bg: #ddd; --toggle-dot: #000;
    --green-text: #15803d;
    --red-text: #b91c1c;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100dvh;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 24px 16px;
    transition: background .3s, color .3s;
    -webkit-font-smoothing: antialiased;
  }

  .container { width: 100%; max-width: 440px; }

  /* ─── Header ─── */
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px;
  }
  .location { font-size: 13px; color: var(--muted); letter-spacing: .3px; }
  .location strong { color: var(--text); font-weight: 600; }

  /* Toggle */
  .toggle {
    width: 48px; height: 26px; border-radius: 13px;
    background: var(--toggle-bg); cursor: pointer;
    position: relative; transition: background .3s;
    border: none; outline: none; flex-shrink: 0;
  }
  .toggle::after {
    content: ''; position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--toggle-dot);
    transition: transform .3s, background .3s;
  }
  [data-theme="light"] .toggle::after { transform: translateX(22px); }

  /* ─── Countdown Hero ─── */
  .hero {
    text-align: center;
    margin-bottom: 36px;
    padding: 28px 0;
    border-bottom: 1px solid var(--border);
  }
  .hero-label {
    font-size: 12px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--muted);
    margin-bottom: 8px; font-weight: 500;
  }
  .hero-prayer {
    font-size: 28px; font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -.5px;
  }
  .hero-time {
    font-size: 14px; color: var(--muted); margin-bottom: 20px;
    font-weight: 500;
  }
  .countdown {
    font-family: 'JetBrains Mono', monospace;
    font-size: 48px; font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
  }
  .countdown-unit {
    font-size: 12px; font-weight: 500;
    letter-spacing: 1px; color: var(--muted);
    font-family: 'Inter', sans-serif;
    margin-top: 6px;
  }
  .hero.praying-now .hero-prayer,
  .hero.praying-now .countdown { color: var(--green-text); }

  /* ─── Date ─── */
  .date-bar {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted);
    margin-bottom: 16px; font-weight: 500;
  }

  /* ─── Prayer Rows ─── */
  .prayer-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    transition: opacity .3s;
  }
  .prayer-row.passed { opacity: .35; }

  .prayer-row.window-green,
  .prayer-row.window-red,
  .prayer-row.window-next {
    opacity: 1;
    border-radius: 12px;
    padding: 16px 16px;
    margin: 4px -16px;
    border-bottom-color: transparent;
  }
  .prayer-row.window-green + .prayer-row,
  .prayer-row.window-red + .prayer-row,
  .prayer-row.window-next + .prayer-row { border-top: none; }

  .prayer-row.window-next { background: var(--active-bg); color: var(--active-text); }
  .prayer-row.window-next .time-col,
  .prayer-row.window-next .leave-col { color: var(--active-text); }
  .prayer-row.window-next .time-col { opacity: .7; }
  .prayer-row.window-next .col-label { color: var(--active-text); opacity: .5; }
  .prayer-row.window-next .offset-tag { background: rgba(128,128,128,.25); color: var(--active-text); }

  .prayer-row.window-green { background: var(--green-bg); box-shadow: inset 0 0 0 1px var(--green-border); }
  .prayer-row.window-green .offset-tag { background: rgba(34,197,94,.15); color: var(--green-text); }

  .prayer-row.window-red { background: var(--red-bg); box-shadow: inset 0 0 0 1px var(--red-border); }
  .prayer-row.window-red .offset-tag { background: rgba(239,68,68,.15); color: var(--red-text); }

  .status-pill {
    font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 10px;
    letter-spacing: .3px; text-transform: uppercase;
  }
  .status-pill.green { background: var(--green-text); color: #06280f; }
  .status-pill.red { background: var(--red-text); color: #2b0705; }

  .prayer-name {
    font-weight: 600; font-size: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .offset-tag {
    font-size: 10px; font-weight: 600;
    background: var(--tag-bg); color: var(--tag-text);
    padding: 2px 6px; border-radius: 4px;
    letter-spacing: .3px;
  }

  .time-col {
    text-align: right; font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500; color: var(--muted);
    line-height: 1.1;
  }

  .leave-col {
    text-align: right; font-size: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    min-width: 82px;
  }

  .col-label {
    display: block; font-size: 9px;
    text-transform: uppercase; letter-spacing: .8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500; color: var(--muted);
    margin-bottom: 2px;
  }

  /* ─── Footer ─── */
  .footer {
    text-align: center; margin-top: 24px;
    font-size: 11px; color: var(--muted);
    letter-spacing: .3px;
  }

  @media (max-width: 380px) {
    .countdown { font-size: 40px; }
    .hero-prayer { font-size: 24px; }
    .prayer-name { font-size: 15px; }
    .leave-col { font-size: 15px; min-width: 74px; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="location"><strong>Riyadh</strong> · Saudi Arabia</div>
      <button class="toggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>
    </div>

    <div class="hero" id="hero">
      <div class="hero-label" id="heroLabel">Time until</div>
      <div class="hero-prayer" id="nextPrayer">—</div>
      <div class="hero-time" id="nextTime"></div>
      <div class="countdown" id="countdown">--:--:--</div>
      <div class="countdown-unit">hours &nbsp; min &nbsp;&nbsp; sec</div>
    </div>

    <div class="date-bar">
      <span>Mon, 24 Aug 2026</span>
      <span>11 Rabi ul Awal 1448</span>
    </div>

    <div id="prayers"></div>

    <div class="footer">Umm Al-Qura · Hanbali, Maliki, Shafi</div>
  </div>

<script>
const prayers = [
  { name: "Fajr",    azan: "4:11 AM",  offset: 20 },
  { name: "Dhuhr",   azan: "11:56 AM", offset: 15 },
  { name: "Asr",     azan: "3:25 PM",  offset: 15 },
  { name: "Maghrib", azan: "6:20 PM",  offset: 5  },
  { name: "Isha",    azan: "7:50 PM",  offset: 15 },
];

function parseTime(str) {
  const [time, period] = str.split(' ');
  let [h, m] = time.split(':').map(Number);
  if (period === 'PM' && h !== 12) h += 12;
  if (period === 'AM' && h === 12) h = 0;
  const d = new Date(); d.setHours(h, m, 0, 0);
  return d;
}

const URGENT_MIN = 5; // how long after leave time the namaz is considered "starting"

function getTimes(p) {
  const azan = parseTime(p.azan);
  const leave = new Date(azan);
  leave.setMinutes(leave.getMinutes() + p.offset);
  const urgentEnd = new Date(leave);
  urgentEnd.setMinutes(urgentEnd.getMinutes() + URGENT_MIN);
  return { azan, leave, urgentEnd };
}

function formatTime(d) {
  let h = d.getHours(), m = d.getMinutes();
  const p = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + String(m).padStart(2, '0') + ' ' + p;
}

let firstRender = true;
let lastCurIdx = null;

function render() {
  const now = new Date();
  const container = document.getElementById('prayers');
  container.innerHTML = '';

  const times = prayers.map(getTimes);

  // The prayer whose window we're currently tracking: the most recent one
  // whose azan has already started.
  let curIdx = -1;
  for (let i = prayers.length - 1; i >= 0; i--) {
    if (now >= times[i].azan) { curIdx = i; break; }
  }
  const curStatus = curIdx === -1 ? null
    : now < times[curIdx].leave ? 'active'
    : now < times[curIdx].urgentEnd ? 'urgent'
    : 'over';

  if (firstRender) {
    lastCurIdx = curIdx;
    firstRender = false;
  } else if (curIdx !== lastCurIdx && curIdx !== -1) {
    playAzanAlert();
    lastCurIdx = curIdx;
  }

  const nextIdx = times.findIndex(t => now < t.azan);

  prayers.forEach((p, i) => {
    const { azan, leave } = times[i];
    let rowClass = '';
    let pill = '';
    if (i < curIdx) {
      rowClass = 'passed';
    } else if (i === curIdx) {
      if (curStatus === 'active') { rowClass = 'window-green'; pill = '<span class="status-pill green">Pray now</span>'; }
      else if (curStatus === 'urgent') { rowClass = 'window-red'; pill = '<span class="status-pill red">Starting</span>'; }
      else { rowClass = 'passed'; }
    } else if (i === nextIdx && curStatus !== 'active' && curStatus !== 'urgent') {
      rowClass = 'window-next';
    }

    const row = document.createElement('div');
    row.className = 'prayer-row' + (rowClass ? ' ' + rowClass : '');
    row.innerHTML = `
      <div class="prayer-name">${p.name} <span class="offset-tag">+${p.offset}m</span>${pill}</div>
      <div class="time-col"><span class="col-label">Azan</span>${formatTime(azan)}</div>
      <div class="leave-col"><span class="col-label">Leave</span>${formatTime(leave)}</div>
    `;
    container.appendChild(row);
  });

  // Hero
  const hero = document.getElementById('hero');
  const heroLabel = document.getElementById('heroLabel');
  const heroP = document.getElementById('nextPrayer');
  const heroT = document.getElementById('nextTime');
  const cd = document.getElementById('countdown');

  if (curStatus === 'active') {
    hero.classList.add('praying-now');
    heroLabel.textContent = 'Time left to leave';
    heroP.textContent = prayers[curIdx].name;
    heroT.textContent = 'Leave by ' + formatTime(times[curIdx].leave);
    formatCountdown(cd, times[curIdx].leave - now);
  } else {
    hero.classList.remove('praying-now');
    heroLabel.textContent = 'Time until';
    if (nextIdx === -1) {
      heroP.textContent = "Fajr (tomorrow)";
      heroT.textContent = prayers[0].azan;
      const tom = new Date(times[0].azan);
      tom.setDate(tom.getDate() + 1);
      formatCountdown(cd, tom - now);
    } else {
      heroP.textContent = prayers[nextIdx].name;
      heroT.textContent = "Azan at " + formatTime(times[nextIdx].azan) + " · Leave at " + formatTime(times[nextIdx].leave);
      formatCountdown(cd, times[nextIdx].azan - now);
    }
  }
}

function formatCountdown(el, ms) {
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  el.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
}

// ─── Azan alert sound: three synthesized beeps, no audio files ───
let audioCtx;
function ensureAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
document.addEventListener('click', ensureAudioCtx, { once: true });
document.addEventListener('touchstart', ensureAudioCtx, { once: true });

function playBeep(ctx, startTime, freq, duration) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(0.3, startTime + 0.01);
  gain.gain.linearRampToValueAtTime(0, startTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}

function playAzanAlert() {
  try {
    const ctx = ensureAudioCtx();
    if (!ctx) return;
    const t0 = ctx.currentTime;
    playBeep(ctx, t0, 880, 0.15);
    playBeep(ctx, t0 + 0.25, 880, 0.15);
    playBeep(ctx, t0 + 0.5, 880, 0.15);
  } catch (e) { /* audio unavailable, ignore */ }
}

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next === 'dark' ? '' : 'light');
  if (next === 'dark') html.removeAttribute('data-theme');
  localStorage.setItem('theme', next);
}

// Init theme
if (localStorage.getItem('theme') === 'light') {
  document.documentElement.setAttribute('data-theme', 'light');
}

render();
setInterval(render, 1000);
</script>
</body>
</html>
